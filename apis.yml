aid: personetics
name: Personetics
description: Personetics is a Cognitive Banking platform that helps banks and financial institutions deliver
  AI-driven, financial-data-personalized customer engagement and money management. Its products analyze
  customer transaction data in real time to surface personalized insights, proactive financial guidance,
  automated savings and cash-flow programs, and self-driving finance experiences embedded inside a bank's
  own mobile and web channels. Personetics serves hundreds of banks and financial institutions across
  roughly 30 global markets, reaching an estimated 150 million banking customers, and positions itself
  as a way for banks to deepen and monetize customer relationships. The platform is delivered as enterprise
  software integrated into a bank's digital banking stack rather than as a public self-serve developer
  API; developer and integration material lives in a gated Personetics Documentation Hub.
